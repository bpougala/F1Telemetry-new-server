name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [ ! -d /home/ec2-user/app ]; then
              git clone https://github.com/bpougala/F1Telemetry-new-server.git /home/ec2-user/app
            fi
            cd /home/ec2-user/app
            git pull
            docker build -t f1telemetry .
            docker stop f1telemetry && docker rm f1telemetry
            VALKEY_ENDPOINT=$(aws elasticache describe-serverless-caches --serverless-cache-name f1telemetry-challenges --query 'ServerlessCaches[0].Endpoint.Address' --output text)
            VALKEY_PORT=$(aws elasticache describe-serverless-caches --serverless-cache-name f1telemetry-challenges --query 'ServerlessCaches[0].Endpoint.Port' --output text)
            docker run -d --name f1telemetry --restart unless-stopped -p 8080:8080 -e AWS_DEFAULT_REGION=eu-west-1 -e VALKEY_ENDPOINT=$VALKEY_ENDPOINT -e VALKEY_PORT=$VALKEY_PORT f1telemetry
            if ! command -v caddy &> /dev/null; then
              curl -fsSL https://github.com/caddyserver/caddy/releases/download/v2.9.1/caddy_2.9.1_linux_amd64.tar.gz -o /tmp/caddy.tar.gz
              sudo tar -xzf /tmp/caddy.tar.gz -C /usr/bin caddy
              sudo chmod +x /usr/bin/caddy
              sudo mkdir -p /etc/caddy
              sudo groupadd --system caddy || true
              sudo useradd --system --gid caddy --create-home --home /var/lib/caddy --shell /usr/sbin/nologin caddy || true
              sudo tee /etc/systemd/system/caddy.service > /dev/null <<'UNIT'
            [Unit]
            Description=Caddy
            After=network.target network-online.target
            Requires=network-online.target

            [Service]
            Type=notify
            User=caddy
            Group=caddy
            ExecStart=/usr/bin/caddy run --environ --config /etc/caddy/Caddyfile
            ExecReload=/usr/bin/caddy reload --config /etc/caddy/Caddyfile --force
            TimeoutStopSec=5s
            LimitNOFILE=1048576
            AmbientCapabilities=CAP_NET_BIND_SERVICE

            [Install]
            WantedBy=multi-user.target
            UNIT
              sudo systemctl daemon-reload
              sudo systemctl enable caddy
            fi
            sudo cp /home/ec2-user/app/Caddyfile /etc/caddy/Caddyfile
            sudo systemctl restart caddy
